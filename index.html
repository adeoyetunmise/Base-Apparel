<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Base Apparel Coming Soon Page</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Josefin Sans', sans-serif;
    }

    /* Desktop Background Image */
    .bg-cover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('./images/bg-pattern-desktop.svg');
      background-size: cover;
      background-position: center;
      z-index: -1;
    }

    /* Desktop Hero Image */
    .hero-image {
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      object-fit: cover;
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .bg-cover {
        display: none;
      }

      .hero-image {
        position: relative;
        width: 100%;
        height: auto;
        object-fit: contain;
      }

      header {
        position: relative;
        left: 0;
        margin: 20px;
        text-align: center;
      }

      .main-content {
        margin-top: 0;
        text-align: center;
      }

      .hero-image {
        object-fit: contain;
        height: 300px;
        /* Set a fixed height for the hero image to avoid covering content */
      }

      .text-red-300 {
        font-size: 1rem;
        /* Adjust for mobile */
      }

      main {
        margin-top: 20px;
        /* Reduce the space below the hero image for mobile */
        padding: 0 16px;
      }

      .main-content {
        flex-direction: column;
        justify-content: center;
        text-align: center;
      }
    }
  </style>
</head>

<body class="lg:overflow-hidden">

  <!-- Background Image (hidden on mobile) -->
  <div class="bg-cover"></div>

  <!-- Hero Image -->
  <img src="./images/hero-desktop.jpg" class="hero-image lg:block hidden" alt="Hero Image">

  <!-- Hero Image (Mobile Version) -->
  <img src="./images/hero-mobile.jpg" class="hero-image lg:hidden mt-6" alt="Hero Image (Mobile Version)">

  <!-- Header with Logo (Mobile position adjustment) -->
  <header class="absolute -top-1  lg:left-28 lg:absolute lg:top-14 lg:block text-center md:text-left">
    <img src="./images/logo.svg" class="w-24 " alt="Logo">
  </header>

  <main
    class="flex flex-col justify-center items-start lg:text-left text-center -mt-32 lg:mt-16  h-screen pt-24 px-8 lg:px-28">
    <div class="container">
      <h1 class="text-5xl lg:text-4xl text-red-300 font-light tracking-widest">WE'RE</h1>
      <h1 class="text-3xl lg:text-4xl font-medium tracking-widest">COMING</h1>
      <h1 class="text-3xl lg:text-4xl font-medium tracking-widest">SOON</h1>
      <p class="text-red-300 mt-4 text-sm lg:text-base">Hello fellow shoppers! We're currently building our new <br>
        fashion store.
        Add your email below to stay up-to-date with announcements and our launch deals.</p>

      <!-- Input and Button -->
      <div class="relative mt-6 w-full max-w-lg">
        <input id="userInput1" type="text" placeholder="Email Address"
          class="w-full p-4 rounded-full border border-red-200 focus:outline-none focus:ring-2 focus:ring-red-300 focus:border-red-300 text-sm">

        <button onclick="show()"
          class="absolute right-3 top-1/2 transform -translate-y-1/2 bg-red-300 text-white px-6 py-2 rounded-3xl transition ease-in-out hover:scale-110 hover:bg-red-400">
          >
        </button>
      </div>
    </div>
  </main>

  <!-- Error Section -->
  <div class="flex items-center space-x-4 mt-4 px-6 lg:ml-28 lg:-mt-6 w-full max-w-lg">
    <!-- Error Icon -->
    <img src="./images/icons8-error-30 (1).png" class="w-5 hidden" id="icon" alt="Error Icon">

    <!-- Validation Message -->
    <div id="display" class="text-red-500 text-sm lg:text-base"></div>
  </div>

  <script src="index.js"></script>

</body>

</html>
